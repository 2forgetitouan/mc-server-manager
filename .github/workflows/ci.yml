name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26.x"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -v ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

  build:
    name: Build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git describe

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Compute version
        id: version
        run: |
          GIT_TAG=$(git describe --tags --exact-match 2>/dev/null || true)
          GIT_SHA=$(git rev-parse --short HEAD)
          if [ -n "$GIT_TAG" ]; then
            echo "version=$GIT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0-dev.$GIT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Build linux/amd64
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          go build \
            -ldflags "-X main.version=${{ steps.version.outputs.version }}" \
            -o mc-linux-amd64 ./cmd/mc

      - name: Build linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
        run: |
          go build \
            -ldflags "-X main.version=${{ steps.version.outputs.version }}" \
            -o mc-linux-arm64 ./cmd/mc

      - name: Verify binaries
        run: |
          file mc-linux-amd64 mc-linux-arm64
          ./mc-linux-amd64 version || true

      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mc-binaries-${{ steps.version.outputs.version }}
          path: |
            mc-linux-amd64
            mc-linux-arm64
          retention-days: 30
